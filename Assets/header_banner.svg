<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Sherif Nafee (Sh1co) — Software Engineer: Developer Tools, Backend, Games &amp; Simulation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="fadeX" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="45%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="70%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="fadeY" x1="0" y1="0" x2="0" y2="1">
      <stop offset="45%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="floorMask">
      <rect width="1200" height="300" fill="url(#fadeX)"/>
    </mask>
    <mask id="floorMaskY">
      <rect width="1200" height="300" fill="url(#fadeY)"/>
    </mask>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- Background card -->
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>

  <!-- Perspective floor grid (games / simulation) -->
  <g mask="url(#floorMask)">
    <g mask="url(#floorMaskY)" stroke="#3b4a6b" stroke-width="1" fill="none">
      <path d="M560 165 H1200 M560 180 H1200 M560 200 H1200 M560 226 H1200 M560 260 H1200"/>
      <path d="M920 150 L380 300 M920 150 L520 300 M920 150 L660 300 M920 150 L800 300 M920 150 L920 300 M920 150 L1040 300 M920 150 L1180 300 M920 150 L1320 300 M920 150 L1460 300"/>
    </g>
  </g>

  <!-- LiDAR-style scan rings -->
  <g mask="url(#floorMask)" fill="none" stroke-linecap="round">
    <path d="M920 222 L1180 170 A260 78 0 0 1 1180 274 Z" fill="url(#sweep)" stroke="none"/>
    <ellipse cx="920" cy="222" rx="70"  ry="21" stroke="#67e8f9" stroke-width="3" stroke-dasharray="0.1 9"  opacity="0.95"/>
    <ellipse cx="920" cy="222" rx="130" ry="39" stroke="#22d3ee" stroke-width="3" stroke-dasharray="0.1 10" opacity="0.75"/>
    <ellipse cx="920" cy="222" rx="195" ry="58" stroke="#22d3ee" stroke-width="3" stroke-dasharray="0.1 11" opacity="0.5"/>
    <ellipse cx="920" cy="222" rx="260" ry="78" stroke="#a78bfa" stroke-width="3" stroke-dasharray="0.1 12" opacity="0.35"/>
    <!-- point-cloud hits on two obstacles -->
    <g stroke="#a5f3fc" stroke-width="3" stroke-dasharray="0.1 7">
      <path d="M1060 205 V160 M1072 207 V158 M1084 209 V160"/>
      <path d="M786 200 V172 M796 198 V168 M806 199 V172"/>
    </g>
  </g>
  <circle cx="920" cy="222" r="34" fill="url(#glow)"/>
  <circle cx="920" cy="222" r="5" fill="#ecfeff"/>

  <!-- Text block -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="80" y="128" font-size="64" font-weight="700" fill="#f1f5f9">Sherif Nafee</text>
    <rect x="82" y="148" width="120" height="4" rx="2" fill="url(#accent)"/>
    <text x="80" y="192" font-family="'Cascadia Code', 'JetBrains Mono', Consolas, 'SF Mono', Menlo, monospace" font-size="24" fill="#cbd5e1"><tspan fill="#a78bfa">~/sh1co</tspan><tspan fill="#64748b"> $ </tspan>software engineer</text>
    <text x="80" y="232" font-size="18" font-weight="600" letter-spacing="2.5" fill="#7c8aa5">DEVELOPER TOOLS  ·  BACKEND  ·  GAMES &amp; SIMULATION</text>
  </g>
</svg>
